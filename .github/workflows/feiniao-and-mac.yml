name: PIC Web and Mac
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [claude/setup-beauty-platform-Dd0m9]
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - run: npm run web:build
      - run: npm run web:test
      - run: python scripts/test-health-archive.py
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - run: for p in project-one project-two project-three project-four; do npm ci --prefix "$p"; npm run build --prefix "$p"; done
      - run: npm ci --prefix desktop
      - run: npm run desktop:build
        env: {CSC_IDENTITY_AUTO_DISCOVERY: 'false'}
      - uses: actions/upload-artifact@v4
        with:
          name: PIC-Mac-unsigned
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
