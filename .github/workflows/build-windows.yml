name: Build Windows (Project One)

# 在 GitHub 的 Windows 云主机上构建 project-one 的 Tauri 安装包（.exe）。
on:
  workflow_dispatch: {}
  push:
    branches: ["claude/intelligent-galileo-flhyf2"]
    paths:
      - "project-one/src/**"
      - "project-one/src-tauri/**"
      - "project-one/package.json"
      - "project-one/package-lock.json"
      - ".github/workflows/build-windows.yml"

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: project-one
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            project-one/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('project-one/src-tauri/Cargo.toml') }}

      - name: Install deps
        run: npm install

      - name: Build Windows installer (NSIS)
        run: npm run dist:win

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: junbai-windows-installer
          path: |
            project-one/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
